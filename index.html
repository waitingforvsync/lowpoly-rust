<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Lowpoly</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 15 5 15 11 8 15 1 11 1 5Z' fill='%234a8df0'/%3E%3Cpath d='M8 1 8 8 15 5M8 8 1 5M8 8 8 15' stroke='%23fff' stroke-opacity='.5' fill='none'/%3E%3C/svg%3E"
    />

    <!-- Built by trunk: compiles the app crate to wasm, optimised for size in release builds. -->
    <link data-trunk rel="rust" href="crates/lowpoly-app/Cargo.toml" data-bin="lowpoly" data-wasm-opt="z" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1b1b;
      }
      #lowpoly_canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading_text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font: 16px system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="lowpoly_canvas"></canvas>
    <div id="loading_text"><p>Loading…</p></div>
  </body>
</html>
