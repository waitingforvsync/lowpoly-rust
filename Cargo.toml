[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/waitingforvsync/lowpoly-rust"

[workspace.dependencies]
lowpoly-editor = { path = "crates/lowpoly-editor" }

eframe = "0.37"
egui = "0.37"
glam = "0.34"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
earcut = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
criterion = { version = "0.8", default-features = false }

# Lints follow BeautifulRust (https://github.com/morganlinton/BeautifulRust), adapted for an
# application workspace: the library-only lints (exhaustive_enums, print_*) are dropped, and
# `as_conversions` is left to the cast_* lints, since graphics code has legitimate casts.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"

cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
# Geometry code reads best with conventional short names (u, v, n, a, b) and paired names
# (loop_a / loops_a).
many_single_char_names = "allow"
similar_names = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep dependencies optimised in dev builds: wgpu and egui are slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
